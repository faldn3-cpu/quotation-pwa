<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧報價擬稿</title>
  
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/png" href="favicon-v2.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.32">
  <style>
    .custom-delivery-box { display: flex !important; gap: 8px !important; align-items: center !important; }
    .custom-delivery-box .search-input { flex: 1 !important; margin-bottom: 0 !important; }
    .delivery-results { overflow-y: auto !important; -webkit-overflow-scrolling: touch !important; flex: 1 !important; min-height: 0 !important; display: flex !important; flex-direction: column !important; gap: 8px !important; touch-action: pan-y !important; }
    .delivery-item { padding: 12px 14px !important; border: 1px solid var(--border-color, #e2e8f0) !important; border-radius: 8px !important; background: #ffffff !important; cursor: pointer !important; font-size: 0.95rem !important; user-select: none !important; -webkit-tap-highlight-color: transparent !important; flex-shrink: 0 !important; }
    .delivery-item:active, .delivery-item.selected { background-color: #eff6ff !important; border-color: var(--primary-color, #2563eb) !important; }
    .delivery-item.selected { color: var(--primary-color, #2563eb) !important; font-weight: 600 !important; }
  </style>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  
  <header class="app-header">
    <div class="header-content">
      <div style="display:flex; align-items:center; gap:8px;">
        <h1>報價擬稿系統</h1>
        <span class="version-tag">v 1.32</span>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <span id="userInfoBadge" class="user-badge hidden" title="點擊可登出帳號" style="cursor:pointer;"></span>
        <button id="btnSync" class="btn-icon hidden" aria-label="同步資料" title="重新同步資料">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
        </button>
        <button id="btnClearCache" class="btn-icon" aria-label="清除快取" title="強制清除快取並重新載入">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
    <div id="offlineIndicator" class="offline-indicator hidden">
      ⚠️ 離線模式：操作將於恢復連線後自動上傳
    </div>
  </header>

  <main class="app-main">
    
    <!-- 登入卡片 -->
    <section id="loginSection" class="card fade-in">
      <h2>登入</h2>
      <p>請使用您的 Google 帳號登入系統</p>
      <button id="btnLogin" class="btn btn-primary btn-block">Google 登入</button>
    </section>

    <!-- 報價表單 -->
    <section id="draftSection" class="card hidden fade-in">
      <form id="draftForm">
        
        <div class="form-group">
          <label for="customerName">客戶名稱</label>
          <input type="text" id="customerName" placeholder="點擊選擇客戶..." required readonly style="cursor:pointer; background:#ffffff;">
          
          <div id="customerDetailCard" class="customer-detail-card hidden">
            <div class="customer-detail-header">
              <span id="customerDetailSummary"></span>
              <button type="button" id="btnToggleCustomerDetail" class="btn-icon" aria-label="展開資訊">
                ▼
              </button>
            </div>
            <div id="customerDetailBody" class="customer-detail-body hidden">
              <div class="detail-row"><span class="detail-label">公司名稱</span><span id="cdCompany"></span></div>
              <div class="detail-row"><span class="detail-label">統一編號</span><span id="cdTaxId"></span></div>
              <div class="detail-row"><span class="detail-label">聯絡人員</span><span id="cdContact"></span></div>
              <div class="detail-row"><span class="detail-label">聯絡電話</span><span id="cdPhone"></span></div>
              <div class="detail-row"><span class="detail-label">公司地址</span><span id="cdAddress"></span></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>報價品項</label>
          <div id="itemsContainer" class="items-list">
            <!-- 動態加入品項 -->
          </div>
          <button type="button" id="btnAddItem" class="btn btn-secondary btn-block mt-3">
            + 新增品項
          </button>
        </div>

        <div class="total-summary-card mt-3">
          <div class="total-summary-top">
            <div class="total-summary-label-group">
              <span class="total-summary-title">小計金額 (未稅)</span>
              <span id="draftItemBadge" class="draft-item-badge">共 1 項</span>
            </div>
          </div>
          <div class="total-summary-bottom">
            <span class="total-summary-amount"><span class="currency-symbol">$</span><span id="totalAmount">0</span></span>
          </div>
        </div>

        <div class="form-actions mt-4">
          <button type="button" id="btnLineQuote" class="btn btn-line btn-block mb-3">
            📱 複製 LINE 報價
          </button>
          <button type="submit" id="btnSubmitDraft" class="btn btn-primary btn-block">
            送出草稿
          </button>
        </div>
      </form>
    </section>

    <!-- 成功畫面 -->
    <section id="successSection" class="card hidden text-center fade-in">
      <div class="success-icon mb-3">✅</div>
      <h2>草稿已送出！</h2>
      <p>您的報價草稿已成功傳送，請稍後至電腦端覆核。</p>
      <button id="btnNewDraft" class="btn btn-primary btn-block mt-4">建立新草稿</button>
    </section>
    
  </main>

  <!-- 客戶搜尋對話框 (Modal) -->
  <div id="customerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>選擇客戶 (<span id="customerModalCount">0</span>)</h3>
        <button id="btnCloseCustomerModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="customerModalSearch" class="search-input" placeholder="搜尋客戶名稱、統編、電話...">
        <div id="customerModalResults" class="customer-results mt-3">
          <!-- 搜尋結果 -->
        </div>
      </div>
    </div>
  </div>

  <!-- LINE 報價預覽對話框 -->
  <div id="lineModal" class="modal hidden">
    <div class="modal-content line-modal-content">
      <div class="modal-header">
        <h3>📱 預覽 LINE 報價訊息</h3>
        <button id="btnCloseLineModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body" style="overflow:visible;">
        <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.5rem; flex-shrink:0;">
          您可以在此修改文字，確認後點擊「一鍵複製」。
        </p>
        <textarea id="lineQuoteText" class="line-quote-textarea"></textarea>
        <div style="display:flex; gap:0.75rem; margin-top:0.75rem; flex-shrink:0;">
          <button type="button" id="btnCancelLineQuote" class="btn btn-secondary" style="flex:1;">取消</button>
          <button type="button" id="btnCopyLineQuote" class="btn btn-line" style="flex:2;">📋 一鍵複製並關閉</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 品項搜尋對話框 (Modal) -->
  <div id="productModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>選擇產品</h3>
        <button id="btnCloseModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="productSearch" class="search-input" placeholder="搜尋型號或品名...">
        <div id="productResults" class="product-results mt-3">
          <!-- 搜尋結果 -->
        </div>
        <button id="btnConfirmProduct" class="btn btn-primary btn-block mt-3 hidden">確認選擇</button>
      </div>
    </div>
  </div>

  <!-- 交期 / 備註選擇對話框 (Modal) -->
  <div id="deliveryModal" class="modal hidden">
    <div class="modal-content" style="height:85vh; height:85dvh; max-height:90vh; display:flex; flex-direction:column; padding:1.25rem 1.25rem 1rem 1.25rem;">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; flex-shrink:0;">
        <h3>選擇交期 / 備註</h3>
        <button id="btnCloseDeliveryModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body" style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;">
        <!-- 自行手動輸入區 (置頂固定) -->
        <label style="font-size:0.85rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; flex-shrink:0;">✍️ 自行手動輸入：</label>
        <div class="custom-delivery-box" style="display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-shrink:0;">
          <input type="text" id="customDeliveryInput" class="search-input" placeholder="輸入自訂交期或特殊備註..." style="flex:1; margin-bottom:0; min-height:42px;">
          <button type="button" id="btnConfirmCustomDelivery" class="btn btn-primary" style="white-space:nowrap; padding:0.65rem 1.2rem; min-height:42px; flex-shrink:0;">確認</button>
        </div>
        
        <div class="delivery-list-header" style="flex-shrink:0; margin-bottom:8px;">
          <span style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">📋 常用預設選項 (點擊直接帶入)：</span>
        </div>
        
        <!-- 預設選項滾動區域 -->
        <div id="deliveryModalResults" class="delivery-results" style="overflow-y:auto !important; -webkit-overflow-scrolling:touch !important; flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding-bottom:24px; touch-action:pan-y;">
          <!-- 預設選項由 JS 動態產生 -->
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>處理中...</p>
  </div>

  <script src="app.js?v=1.32"></script>
</body>
</html>
